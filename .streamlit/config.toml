# Streamlit 主题 —— 这个项目的「设计 token」。
#
# 一条原则:**能写在配置里的,就不要写进 CSS。**
# 配置项是版本稳定的;靠 CSS 选择器去猜 Streamlit 的 DOM 结构,一升级就会碎。
# 所以这里尽量把颜色、圆角、字号层级、状态色全部声明清楚,
# 留给 CSS 的只有「配置表达不了的」那几件事(藏工具条、收窄内容宽度)。
#
# 调色板 = slate 中性色阶 + 单一靛蓝强调色。
# 之前的问题不是「不好看」,是**只有四个颜色**:所有元素都是同一个蓝,
# 没有中性层级、没有状态色,所以看起来像没收拾。

[theme]
base = "light"

# ---- 主色:靛蓝。比默认蓝克制,配石板灰像「工具」而不是「演示」----
primaryColor = "#4F46E5"

# ---- 中性色阶:slate 系列 ----
backgroundColor          = "#FFFFFF"   # 主内容区(纯白)
secondaryBackgroundColor = "#F8FAFC"   # 输入控件 / 卡片底 / 侧边栏(slate-50)
borderColor              = "#E2E8F0"   # slate-200
textColor                = "#0F172A"   # slate-900

# ---- 圆角:一个基准值派生到所有控件 ----
baseRadius   = "0.65rem"
buttonRadius = "0.5rem"

# ---- 链接 ----
linkColor     = "#4F46E5"
linkUnderline = false

# ---- 字号层级:工具界面密度优先,标题不要那么大 ----
# ⚠ baseFontSize 必须是**整数**(像素),写成 "15px" 会让 protobuf 赋值抛异常,
#   Streamlit 于是**整个 [theme] 块都不要了**,静默回落到默认配色(红按钮)。
#   这个坑没有报错提示,只在服务端 stderr 里留一条 traceback。
baseFontSize          = 15
headingFontSizes      = ["1.7rem", "1.3rem", "1.08rem", "0.98rem", "0.92rem", "0.88rem"]
headingFontWeights    = [700, 600, 600, 600, 600, 600]
metricValueFontSize   = "1.65rem"
metricValueFontWeight = 700

# ---- 代码块:报告的主要载体,给它一个安静的底色 ----
codeBackgroundColor = "#F8FAFC"
codeTextColor       = "#0F172A"
codeFontSize        = "0.8rem"

# ---- 控件描边:白底上不给描边,输入框会飘 ----
showWidgetBorder  = true
showSidebarBorder = true

# ---- 状态色:原来全是同一个蓝,看不出「这是警告」还是「这是成功」----
greenColor           = "#15803D"
greenBackgroundColor = "#F0FDF4"
greenTextColor       = "#15803D"

yellowColor           = "#A16207"
yellowBackgroundColor = "#FEFCE8"
yellowTextColor       = "#A16207"

orangeColor           = "#C2410C"
orangeBackgroundColor = "#FFF7ED"
orangeTextColor       = "#C2410C"

redColor           = "#B91C1C"
redBackgroundColor = "#FEF2F2"
redTextColor       = "#B91C1C"

blueColor           = "#1D4ED8"
blueBackgroundColor = "#EFF6FF"
blueTextColor       = "#1D4ED8"

violetColor           = "#6D28D9"
violetBackgroundColor = "#F5F3FF"
violetTextColor       = "#6D28D9"

grayColor           = "#475569"
grayBackgroundColor = "#F1F5F9"
grayTextColor       = "#475569"

# ---- 侧边栏 ----
sidebar.backgroundColor = "#F8FAFC"
