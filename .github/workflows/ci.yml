name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 装完整依赖(而不是只装测试要用的那几个):
      # 顺带验证「别人 clone 下来按 README 装一遍能不能装起来」。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 47 个用例全部是纯函数与假 LLM,不需要 DEEPSEEK_API_KEY。
      - name: 跑测试
        run: pytest -q
